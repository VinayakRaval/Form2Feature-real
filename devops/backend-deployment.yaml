apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: form2feature
spec:
  replicas: 2

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      containers:
        - name: backend

          image: devopsvinu/form2feature-backend:IMAGE_TAG

          imagePullPolicy: Always

          ports:
            - containerPort: 5000

          env:
            - name: PORT
              value: "5000"

            - name: DB_HOST
              value: "mysql"

            - name: DB_USER
              value: "root"

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: form2feature-secret
                  key: MYSQL_ROOT_PASSWORD

            - name: DB_NAME
              value: "form2feature"

            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: form2feature-secret
                  key: JWT_SECRET

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"

          readinessProbe:
            tcpSocket:
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10

          livenessProbe:
            tcpSocket:
              port: 5000
            initialDelaySeconds: 20
            periodSeconds: 20